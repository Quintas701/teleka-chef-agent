<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teleka Chef Agent</title>
<style>
  :root{
    --espresso:#1C1410; --coral:#E8562A; --basil:#2F6D5C;
    --cream:#FBF7F2; --card:#FFFFFF; --line:#EADFD3; --muted:#7A6E63;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--cream);color:var(--espresso);line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--coral);display:flex;
        align-items:center;justify-content:center;font-size:22px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);margin:2px 0 18px;font-size:14px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#F1E8DE;color:var(--muted)}
  .badge b{color:var(--basil)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  label{font-weight:600;font-size:14px;display:block;margin-bottom:8px}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;
           font-family:inherit;resize:vertical;min-height:64px;background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
  .chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
        background:#fff;cursor:pointer;color:var(--muted);font-weight:400}
  button{font-family:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;
         font-size:15px;cursor:pointer}
  .primary{background:var(--coral);color:#fff;width:100%;margin-top:14px}
  .primary:disabled{opacity:.5;cursor:default}
  .pay{background:#0070BA;color:#fff;width:100%;margin-top:6px}
  .hidden{display:none}
  .dish{display:flex;gap:14px;align-items:flex-start}
  .dish img{width:120px;height:120px;border-radius:12px;object-fit:cover;background:#F1E8DE;flex:0 0 auto}
  .dish .ph{width:120px;height:120px;border-radius:12px;background:#F1E8DE;display:flex;
            align-items:center;justify-content:center;font-size:40px}
  h2{font-size:17px;margin:0 0 4px}
  ol{margin:10px 0 0;padding-left:18px;color:#3a322c;font-size:14px}
  ol li{margin-bottom:3px}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
  td{padding:8px 0;border-bottom:1px solid var(--line)}
  td.r{text-align:right;white-space:nowrap}
  .vend{color:var(--muted);font-size:12px}
  .total{display:flex;justify-content:space-between;font-weight:700;margin-top:12px;font-size:16px}
  .ok{border-color:var(--basil)}
  .ok h2{color:var(--basil)}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#E7F0ec;color:var(--basil)}
  .muted{color:var(--muted);font-size:13px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;
        border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .erro{border-color:#E8A08A;background:#FFF6F2}
  .chip:hover{border-color:var(--coral);color:var(--espresso)}
  .flow{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🍲</div>
    <div>
      <h1>Teleka Chef Agent</h1>
    </div>
  </header>
  <div class="sub">Diz o que tens na cozinha. A IA cria a receita, monta o carrinho com vendedores locais e paga pela PayPal.</div>

  <div class="badges" id="badges">
    <span class="badge">PayPal: <b id="b-paypal">…</b></span>
    <span class="badge">IA: <b id="b-ia">…</b></span>
  </div>

  <div class="card">
    <label for="pedido">O que tens em casa?</label>
    <textarea id="pedido" placeholder="ex.: tenho arroz, tomate e peixe">tenho arroz, tomate e peixe</textarea>
    <div class="chips" id="chips"></div>
    <button class="primary" id="go">Gerar receita e carrinho</button>
  </div>

  <div id="resultado"></div>
  <div id="confirmacao"></div>

  <div class="flow">pedido → receita → carrinho → PayPal (sandbox) → vendedor pago → coleção</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ultimo = null;

// Tudo o que vem do servidor (e do LLM, que o utilizador pode influenciar) e texto, nunca HTML.
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function money(v, m){ return Number(v).toFixed(2) + " " + esc(m); }
function guardar(k, v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function ler(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }
function erroCard(msg){ return `<div class="card erro"><b>Algo correu mal.</b><div class="muted">${esc(msg)}</div></div>`; }

async function api(url, corpo){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                              body: JSON.stringify(corpo)});
  let d = null;
  try{ d = await r.json(); }catch(e){}
  if(!r.ok){
    const det = d && (d.erro || (Array.isArray(d.detail) ? d.detail.map(x => x.msg).join("; ") : d.detail));
    throw new Error(det || `HTTP ${r.status}`);
  }
  return d;
}

const EXEMPLOS = ["tenho arroz, tomate e peixe", "frango, batata e cenoura", "ovos, farinha e leite"];
$("chips").innerHTML = EXEMPLOS.map(e => `<button type="button" class="chip">${esc(e)}</button>`).join("");
document.querySelectorAll(".chip").forEach(c =>
  c.onclick = () => { $("pedido").value = c.textContent; });

fetch("/api/estado").then(r => r.json()).then(s => {
  $("b-paypal").textContent = s.paypal === "sandbox" ? "sandbox" : "mock (demo)";
  $("b-ia").textContent = s.ia === "configurada" ? "Groq/LLM" : "modelo offline";
  if(s.paypal_aviso) $("b-paypal").title = s.paypal_aviso;
}).catch(() => { $("b-paypal").textContent = $("b-ia").textContent = "sem ligação"; });

$("go").onclick = async () => {
  const pedido = $("pedido").value.trim();
  if(!pedido) return;
  $("confirmacao").innerHTML = "";
  $("go").disabled = true;
  $("go").innerHTML = '<span class="spin"></span>A pensar…';
  try{
    ultimo = await api("/api/gerar", {pedido});
    guardar("teleka_ultimo", ultimo);
    renderResultado(ultimo);
  } catch(e){
    $("resultado").innerHTML = erroCard(e.message);
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Gerar receita e carrinho";
  }
};

function renderResultado(d){
  const rec = d.receita;
  const linhas = d.carrinho.map(p =>
    `<tr><td>${esc(p.nome)}<div class="vend">${esc(p.vendedor)}</div></td>
         <td class="r">${money(p.preco, p.moeda)}</td></tr>`).join("");
  const passos = rec.passos.map(p => `<li>${esc(p)}</li>`).join("");
  const semStock = (d.nao_encontrados || []).length
    ? `<div class="muted" style="margin-top:8px">Sem vendedor no marketplace: ${esc(d.nao_encontrados.join(", "))}</div>` : "";
  const botao = d.order
    ? `<div class="muted" style="margin-top:8px">Order PayPal: <code>${esc(d.order.id)}</code> · ${esc(d.order.status)}</div>
       <button class="pay" id="pay">Pagar com PayPal (${esc(d.paypal_modo)})</button>`
    : `<div class="muted" style="margin-top:8px">Já tens tudo — nada a comprar.</div>`;
  $("resultado").innerHTML = `
    <div class="card">
      <div class="dish">
        <img src="${esc(d.imagem_url)}" alt="${esc(rec.titulo)}">
        <div>
          <h2>${esc(rec.titulo)}</h2>
          <div class="muted">${esc(rec.descricao)}</div>
          <div class="muted" style="margin-top:6px">motor: ${esc(rec.motor)}</div>
        </div>
      </div>
      <ol>${passos}</ol>
    </div>
    <div class="card">
      <h2>Carrinho <span class="muted">(ingredientes em falta)</span></h2>
      <table>${linhas}</table>
      <div class="total"><span>Total</span><span>${money(d.total, d.moeda)}</span></div>
      ${semStock}
      ${botao}
    </div>`;
  const img = document.querySelector(".dish img");
  if(img) img.onerror = () => { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "🍲"; img.replaceWith(ph); };
  const pay = $("pay");
  if(pay) pay.onclick = pagar;
}

async function pagar(){
  const pay = $("pay");
  // Sandbox real: o comprador aprova na PayPal e volta a esta pagina (?token=...).
  if(ultimo.order.approve_url){
    pay.disabled = true;
    pay.innerHTML = '<span class="spin"></span>A abrir a PayPal…';
    window.location.href = ultimo.order.approve_url;
    return;
  }
  await confirmar(ultimo.order.id);
}

async function confirmar(orderId){
  const pay = $("pay");
  if(pay){ pay.disabled = true; pay.innerHTML = '<span class="spin"></span>A pagar…'; }
  try{
    const c = await api("/api/confirmar", {order_id: orderId});
    const pos = c.payouts.map(p =>
      `<tr><td>${esc(p.vendedor)}<div class="vend">${esc(p.destinatario)}</div></td>
           <td class="r"><span class="pill">${esc(p.status)}</span> ${money(p.valor, p.moeda)}</td></tr>`).join("");
    if(pay) pay.remove();
    $("confirmacao").innerHTML = `
      <div class="card ok">
        <h2>✓ Pagamento concluído</h2>
        <div class="muted">Captura <code>${esc(c.captura.id)}</code> · ${esc(c.captura.status)}</div>
        <h2 style="margin-top:14px;font-size:15px">Vendedores pagos</h2>
        <table>${pos}</table>
        <div class="muted" style="margin-top:12px">${esc(c.mensagem)}</div>
      </div>`;
  } catch(e){
    $("confirmacao").innerHTML = erroCard(e.message);
    if(pay){ pay.disabled = false; pay.textContent = "Tentar de novo"; }
  }
}

// Regresso da PayPal: ?paypal=aprovado&token=<order_id>&PayerID=...  ou  ?paypal=cancelado
(function regresso(){
  const q = new URLSearchParams(location.search);
  if(!q.has("paypal")) return;
  history.replaceState(null, "", location.pathname);
  ultimo = ler("teleka_ultimo");
  if(ultimo) renderResultado(ultimo);
  if(q.get("paypal") === "cancelado"){
    $("confirmacao").innerHTML = `<div class="card"><b>Pagamento cancelado.</b><div class="muted">Nada foi cobrado. Podes tentar de novo.</div></div>`;
  } else if(q.get("token")){
    confirmar(q.get("token"));
  }
})();
</script>
</body>
</html>
